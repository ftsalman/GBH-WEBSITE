
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Vite website
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || {
            echo "::error::dist/index.html was not generated"
            exit 1
          }

      - name: Upload tested build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to Hostinger
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://ads.gbhgroup.ae' }}

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify deployment files
        run: |
          test -f dist/index.html || {
            echo "::error::dist/index.html is missing"
            exit 1
          }

      - name: Configure contact form mail settings
        run: node scripts/write-php-config.mjs dist/api/contact-config.php
        env:
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          CONTACT_TO: ${{ vars.CONTACT_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Deploy website to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: 21
          local-dir: dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}

      - name: Check live contact endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ads.gbhgroup.ae' }}
        run: |
          set -euo pipefail

          response=$(curl --silent --show-error --fail \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --request POST \
            "${SITE_URL%/}/api/contact" \
            --header "Content-Type: application/json" \
            --data '{"website":"ci-check"}')

          echo "Contact endpoint response: $response"

          echo "$response" | grep -q '"ok":true' || {
            echo "::error::Contact endpoint check failed."
            echo "Check .htaccess, api/contact.php and PHP configuration."
            exit 1
          }
