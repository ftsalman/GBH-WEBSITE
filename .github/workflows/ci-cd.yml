name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its older run; runs on main are never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/contact.php

      # The deploy job ships exactly what was tested. .htaccess is a hidden file, so include it.
      - name: Keep the build for deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            !dist/api/contact-config.php
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Hostinger
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://ads.gbhgroup.ae' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Validate FTP settings
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html/ads/' }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done
          if [[ "$FTP_SERVER" == *"://"* || "$FTP_SERVER" == *"/"* ]]; then
            echo "::error::FTP_SERVER must contain only the FTP hostname or IP, without a protocol or folder."
            exit 1
          fi
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::FTP_SERVER_DIR must end with /."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify deployment files
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/contact.php

      - name: Prepare contact form mail settings
        id: mail
        shell: bash
        run: |
          if [[ -n "$SMTP_PASS" ]]; then
            node scripts/write-php-config.mjs dist/api/contact-config.php
          else
            # Excluded files are neither uploaded nor deleted by the FTP action.
            echo "exclude=**/api/contact-config.php" >> "$GITHUB_OUTPUT"
            echo "::warning::SMTP_PASS is not set. Preserving api/contact-config.php on the server. Contact email requires that file to be configured there."
          fi
        env:
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          CONTACT_TO: ${{ vars.CONTACT_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      # Uploads only files that changed since the last deploy (tracked in a state file on the server).
      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: ./dist/
          # FTP account root: /home/u449961891/domains/gbhgroup.ae/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/ads/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            ${{ steps.mail.outputs.exclude }}

      # Checks routing/PHP only; the honeypot returns before SMTP config is loaded.
      - name: Check the live contact endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ads.gbhgroup.ae' }}
        run: |
          response=$(curl --fail-with-body -sS --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused -X POST "${SITE_URL%/}/api/contact" \
            -H "Content-Type: application/json" -d '{"website":"ci-check"}')
          echo "$response" | jq -e '.ok == true' > /dev/null || {
            echo "::error::The contact endpoint is not answering. Check .htaccess and api/contact.php on the server."
            exit 1
          }
