name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its older run; runs on main are never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/contact.php

      # The deploy job ships exactly what was tested. .htaccess is a hidden file, so include it.
      - name: Keep the build for deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            !dist/api/contact-config.php
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Hostinger
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://ads.gbhgroup.ae' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Validate FTP settings
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done
          # No default: the folder depends on where the FTP account starts (see docs/deployment.md).
          if [[ -z "$FTP_SERVER_DIR" ]]; then
            echo "::error::Missing Actions variable FTP_SERVER_DIR: the site's document root relative to the FTP login folder, ending in /."
            exit 1
          fi
          if [[ "$FTP_SERVER" == *"://"* || "$FTP_SERVER" == *"/"* ]]; then
            echo "::error::FTP_SERVER must contain only the FTP hostname or IP, without a protocol or folder."
            exit 1
          fi
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::FTP_SERVER_DIR must end with /."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/ftp-deploy/package-lock.json

      - name: Install deploy tool
        run: npm ci --prefix scripts/ftp-deploy

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify deployment files
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/contact.php

      - name: Prepare contact form mail settings
        id: mail
        shell: bash
        run: |
          if [[ -n "$SMTP_PASS" ]]; then
            node scripts/write-php-config.mjs dist/api/contact-config.php
          else
            # Excluded files are neither uploaded nor deleted by the FTP action.
            echo "exclude=**/api/contact-config.php" >> "$GITHUB_OUTPUT"
            echo "::warning::SMTP_PASS is not set. Preserving api/contact-config.php on the server. Contact email requires that file to be configured there."
          fi
        env:
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          CONTACT_TO: ${{ vars.CONTACT_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      # Uploads only files that changed since the last deploy (tracked in a state file on the server).
      # Not SamKirkland/FTP-Deploy-Action: its FTP library breaks FTPS on Node 24 (see the script).
      - name: Upload to Hostinger
        run: node scripts/ftp-deploy/deploy.mjs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_LOCAL_DIR: ./dist/
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_EXCLUDE: ${{ steps.mail.outputs.exclude }}
          FTP_LOG_LEVEL: ${{ vars.FTP_LOG_LEVEL || 'standard' }}

      # A successful upload to the wrong folder looks like success; compare the live page's script
      # bundle (its name changes with every build) with the one just uploaded.
      - name: Check the live site serves this build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ads.gbhgroup.ae' }}
        run: |
          expected=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)
          for attempt in 1 2 3; do
            live=$(curl -sS --connect-timeout 10 --max-time 30 -H "Cache-Control: no-cache" \
              "${SITE_URL%/}/?deploy=${GITHUB_SHA}" | grep -oE 'assets/index-[^"]+\.js' | head -1 || true)
            [[ "$live" == "$expected" ]] && { echo "Live site serves $expected."; exit 0; }
            sleep 10
          done
          echo "::error::$SITE_URL serves ${live:-no recognisable build}, but this deploy uploaded $expected. The upload went to a folder this site does not serve: fix FTP_SERVER_DIR (or the FTP account) as described in docs/deployment.md."
          exit 1

      # A partial upload still passes the check above; every static file must be served too.
      - name: Check the live site serves every file
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ads.gbhgroup.ae' }}
        run: |
          failed=0
          while IFS= read -r file; do
            path=${file#dist/}
            status=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 60 \
              --retry 2 --retry-delay 5 "${SITE_URL%/}/${path// /%20}?deploy=${GITHUB_SHA}" || true)
            if [[ "$status" != 200 ]]; then
              echo "::error::${SITE_URL%/}/$path returned HTTP $status"
              failed=1
            fi
          done < <(find dist -type f ! -path 'dist/api/*' ! -name '.*' | sort)
          [[ $failed == 0 ]] && echo "All files are served." || { echo "Re-run this workflow: the deploy uploads missing or incomplete files again."; exit 1; }

      # Checks routing/PHP only; the honeypot returns before SMTP config is loaded.
      - name: Check the live contact endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ads.gbhgroup.ae' }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused -X POST "${SITE_URL%/}/api/contact" \
            -H "Content-Type: application/json" -d '{"website":"ci-check"}' || true)
          if [[ "$status" == 200 ]] && jq -e '.ok == true' response.json > /dev/null 2>&1; then
            echo "Contact endpoint answers."
            exit 0
          fi
          case "$status" in
            404) hint="api/contact.php or the /api/contact rewrite in .htaccess is missing from the folder this site serves." ;;
            405) hint="the request reached the server as something other than POST; check redirects (http to https, trailing slash)." ;;
            5*) hint="PHP failed; check the PHP error log in hPanel." ;;
            *) hint="unexpected response: $(head -c 300 response.json)" ;;
          esac
          echo "::error::POST ${SITE_URL%/}/api/contact returned HTTP $status: $hint"
          exit 1
